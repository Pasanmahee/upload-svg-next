services:
  app:
    build: .
    ports:
      - '8080:8080'
    environment:
      # Server-only env vars (do NOT use NEXT_PUBLIC_ for secrets)
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME:-svgfacetpaintbynumber}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-svg-image-processing-bucket}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      MAX_RECORDS_PER_USER: ${MAX_RECORDS_PER_USER:-3}
